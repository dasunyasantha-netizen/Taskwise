<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <script>
      // Apply saved light/dark theme and Sinhala font before first paint (src/hooks/useTheme.ts, useSinhalaFont.ts)
      (function () {
        try {
          var f = localStorage.getItem('tw_si_font');
          if (f === 'noto-serif' || f === 'maname') document.documentElement.setAttribute('data-si-font', f);
          var p = localStorage.getItem('tw_theme');
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) { document.documentElement.classList.add('dark'); document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1017'); }
        } catch (e) {}
      })();
    </script>
    <title>TaskWise — Team Task Management, Projects &amp; Approvals</title>
    <meta name="description" content="Manage team projects, task assignments, approval workflows, and audit trails with TaskWise, a structured workspace for modern organizations." />
    <link rel="canonical" href="https://syswise.lk/taskwise/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Serif+Sinhala:wght@400;500;600;700&family=Maname&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      .seo-page-heading {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"SoftwareApplication","name":"TaskWise","url":"https://syswise.lk/taskwise/","applicationCategory":"BusinessApplication","operatingSystem":"Web","description":"A structured team workspace for projects, task assignments, approval workflows, and complete audit trails.","provider":{"@type":"Organization","name":"SysWise","url":"https://syswise.lk/"}}
    </script>
  </head>
  <body>
    <div id="root"><h1 class="seo-page-heading">TaskWise Team Task Management</h1></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
